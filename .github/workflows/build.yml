name: Build QuizNova APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Force Environment Paths & Install Tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install "cython<3.0.0" buildozer
          echo "$(python -c 'import sys; print(sys.prefix)')/bin" >> $GITHUB_PATH

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug
        env:
          PYTHON: python3
          P4A_RELEASE_KEY: ""

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizNova-APK
          path: bin/*.apk
