name: Build QuizNova APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev uuid-dev git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Force Python 3.10 as Default System Python
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 $(which python3.10) 1
          sudo update-alternatives --set python3 $(which python3.10)
          python3 --version

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install "cython<3.0.0" buildozer

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizNova-APK
          path: bin/*.apk
